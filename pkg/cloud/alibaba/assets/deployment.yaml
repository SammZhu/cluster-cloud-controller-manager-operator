apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: alibaba-cloud-controller-manager
    infrastructure.openshift.io/cloud-controller-manager: {{ .cloudproviderName }}
  name: alibaba-cloud-controller-manager
  namespace: openshift-cloud-controller-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      k8s-app: alibaba-cloud-controller-manager
      infrastructure.openshift.io/cloud-controller-manager: {{ .cloudproviderName }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        target.workload.openshift.io/management: '{"effect": "PreferredDuringScheduling"}'
      labels:
        k8s-app: alibaba-cloud-controller-manager
        infrastructure.openshift.io/cloud-controller-manager: {{ .cloudproviderName }}
    spec:
      priorityClassName: system-cluster-critical
      containers:
      - name: cloud-controller-manager
        command:
        - /bin/bash
        - -c
        - |
          #!/bin/bash
          set -o allexport
          if [[ -f /etc/kubernetes/apiserver-url.env ]]; then
            source /etc/kubernetes/apiserver-url.env
          fi
          exec /bin/alibaba-cloud-controller-manager \
          --cloud-config=/etc/kubernetes/cloud-config/cloud-config \
          --cloud-provider=alibabacloud \
          --use-service-account-credentials=true \
          --leader-elect=true \
          --leader-elect-lease-duration=137s \
          --leader-elect-renew-deadline=107s \
          --leader-elect-retry-period=26s \
          --leader-elect-resource-namespace=openshift-cloud-controller-manager \
          {{- if .tlsCipherSuites }}
          --tls-cipher-suites={{ .tlsCipherSuites }} \
          {{- end }}
          {{- if .tlsMinVersion }}
          --tls-min-version={{ .tlsMinVersion }} \
          {{- end }}
          --secure-port=0 \
          -v=2
        image: {{ .images.CloudControllerManager }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 10258
          name: https
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 50Mi
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - mountPath: /etc/kubernetes
          name: host-etc-kube
          readOnly: true
        - mountPath: /etc/kubernetes/cloud-config
          name: cloud-config
          readOnly: true
        - mountPath: /etc/pki/ca-trust/extracted/pem
          name: trusted-ca
          readOnly: true
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/master: ""
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchLabels:
                k8s-app: alibaba-cloud-controller-manager
                infrastructure.openshift.io/cloud-controller-manager: {{ .cloudproviderName }}
      serviceAccountName: cloud-controller-manager
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 120
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 120
      - effect: NoSchedule
        key: node.cloudprovider.kubernetes.io/uninitialized
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/not-ready
        operator: Exists
      volumes:
      - name: host-etc-kube
        hostPath:
          path: /etc/kubernetes
          type: Directory
      - name: cloud-config
        configMap:
          name: cloud-conf
          items:
          - key: cloud.conf
            path: cloud-config
      - name: trusted-ca
        configMap:
          name: ccm-trusted-ca
          items:
          - key: ca-bundle.crt
            path: tls-ca-bundle.pem
